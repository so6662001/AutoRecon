<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>信用评分 - 对账通原型</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/element-plus@2.9.1/dist/index.css">
  <script src="https://cdn.jsdelivr.net/npm/vue@3.5.13/dist/vue.global.prod.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/element-plus@2.9.1/dist/index.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@element-plus/icons-vue@2.3.1/dist/index.iife.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif; background: #f0f2f5; }
    .layout { display: flex; min-height: 100vh; }
    .sidebar {
      width: 220px;
      background: linear-gradient(180deg, #1a1a2e 0%, #16213e 100%);
      color: #fff; flex-shrink: 0; display: flex; flex-direction: column;
    }
    .sidebar-logo {
      padding: 20px; font-size: 18px; font-weight: 700;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      display: flex; align-items: center; gap: 10px;
    }
    .sidebar-logo .dot { width: 10px; height: 10px; background: #67c23a; border-radius: 50%; }
    .sidebar-menu { padding: 12px 0; flex: 1; }
    .menu-group-title { padding: 12px 20px 6px; font-size: 11px; color: rgba(255,255,255,0.35); text-transform: uppercase; letter-spacing: 1px; }
    .menu-item {
      display: flex; align-items: center; gap: 10px;
      padding: 11px 20px; cursor: pointer; font-size: 14px; color: rgba(255,255,255,0.65);
      transition: all 0.2s; border-left: 3px solid transparent;
    }
    .menu-item:hover { background: rgba(255,255,255,0.06); color: #fff; }
    .menu-item.active { background: rgba(64,158,255,0.15); color: #409eff; border-left-color: #409eff; }
    .menu-item .el-icon { font-size: 18px; }
    .main-area { flex: 1; display: flex; flex-direction: column; min-width: 0; }
    .header {
      height: 56px; background: #fff; border-bottom: 1px solid #e8e8e8;
      display: flex; align-items: center; justify-content: space-between; padding: 0 24px;
    }
    .header-left { display: flex; align-items: center; gap: 16px; }
    .header-right { display: flex; align-items: center; gap: 16px; }
    .content { flex: 1; padding: 24px; overflow-y: auto; }
    .page-title { font-size: 20px; font-weight: 700; color: #1a1a2e; margin-bottom: 20px; }
    .table-card { background: #fff; border-radius: 8px; padding: 20px; box-shadow: 0 1px 4px rgba(0,0,0,0.04); }
    .rank-medal { display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px; border-radius: 50%; font-size: 13px; font-weight: 700; }
    .rank-1 { background: linear-gradient(135deg, #ffd700, #ffb347); color: #fff; }
    .rank-2 { background: linear-gradient(135deg, #c0c0c0, #a8a8a8); color: #fff; }
    .rank-3 { background: linear-gradient(135deg, #cd7f32, #b8860b); color: #fff; }
    .rank-n { background: #f0f2f5; color: #909399; }
    .trend-up { color: #67c23a; font-weight: 700; }
    .trend-down { color: #f56c6c; font-weight: 700; }
    .trend-flat { color: #909399; font-weight: 700; }
    .dialog-charts { display: flex; gap: 20px; margin-bottom: 20px; }
    .dialog-chart-box { flex: 1; height: 280px; }
  </style>
</head>
<body>
<div id="app">
  <div class="layout">
    <aside class="sidebar">
      <div class="sidebar-logo"><span class="dot"></span><span>对账通 AutoRecon</span></div>
      <nav class="sidebar-menu">
        <div class="menu-group-title">核心功能</div>
        <div class="menu-item"><el-icon><Odometer /></el-icon><span>工作台</span></div>
        <div class="menu-item"><el-icon><Document /></el-icon><span>对账单管理</span></div>
        <div class="menu-item"><el-icon><DataAnalysis /></el-icon><span>比对结果</span></div>
        <div class="menu-item"><el-icon><Money /></el-icon><span>付款管理</span></div>
        <div class="menu-group-title">辅助功能</div>
        <div class="menu-item"><el-icon><Stamp /></el-icon><span>待签章</span></div>
        <div class="menu-item active"><el-icon><TrophyBase /></el-icon><span>信用评分</span></div>
        <div class="menu-item"><el-icon><DataLine /></el-icon><span>数据分析</span></div>
        <div class="menu-group-title">系统</div>
        <div class="menu-item"><el-icon><Setting /></el-icon><span>系统设置</span></div>
      </nav>
    </aside>

    <div class="main-area">
      <header class="header">
        <div class="header-left"><span style="font-size:14px;color:#606266;">辅助功能 / 信用评分</span></div>
        <div class="header-right">
          <el-badge :value="3" :max="99"><el-icon :size="20"><Bell /></el-icon></el-badge>
          <el-avatar :size="32" style="background:#409eff;">管</el-avatar>
          <span style="font-size:14px;color:#303133;">管理员</span>
        </div>
      </header>

      <div class="content">
        <div class="page-title">信用评分</div>
        <div class="table-card">
          <el-table :data="creditData" border stripe style="width:100%;">
            <el-table-column label="排名" width="70" align="center">
              <template #default="{ row }">
                <span :class="['rank-medal', row.rank <= 3 ? 'rank-' + row.rank : 'rank-n']">{{ row.rank }}</span>
              </template>
            </el-table-column>
            <el-table-column prop="company" label="买方企业" width="150" />
            <el-table-column label="信用评分" width="200">
              <template #default="{ row }">
                <div style="display:flex;align-items:center;gap:10px;">
                  <el-progress :percentage="row.score" :stroke-width="14" :color="row.barColor" :show-text="false" style="flex:1;" />
                  <span style="font-weight:700;font-size:15px;min-width:30px;" :style="{color: row.barColor}">{{ row.score }}</span>
                </div>
              </template>
            </el-table-column>
            <el-table-column label="评级" width="80" align="center">
              <template #default="{ row }">
                <el-tag :type="row.gradeType" size="small" effect="dark">{{ row.grade }}</el-tag>
              </template>
            </el-table-column>
            <el-table-column prop="avgDays" label="平均付款天数" width="120" align="center" />
            <el-table-column prop="overdueRate" label="逾期率" width="90" align="center" />
            <el-table-column prop="disputeRate" label="异议率" width="90" align="center" />
            <el-table-column label="趋势" width="70" align="center">
              <template #default="{ row }">
                <span :class="row.trendClass">{{ row.trend }}</span>
              </template>
            </el-table-column>
            <el-table-column label="操作" width="100" align="center">
              <template #default="{ row }">
                <el-button type="primary" link size="small" @click="showDetail(row)">查看详情</el-button>
              </template>
            </el-table-column>
          </el-table>
        </div>
      </div>
    </div>
  </div>

  <!-- Detail Dialog -->
  <el-dialog v-model="dialogVisible" :title="currentRow.company + ' — 信用详情'" width="800px" @opened="initCharts">
    <div class="dialog-charts">
      <div class="dialog-chart-box" ref="gaugeChartRef"></div>
      <div class="dialog-chart-box" ref="radarChartRef"></div>
    </div>
    <el-table :data="paymentHistory" border stripe size="small" style="width:100%;">
      <el-table-column prop="id" label="付款流水号" />
      <el-table-column prop="date" label="付款日期" />
      <el-table-column prop="amount" label="金额" align="right" />
      <el-table-column prop="days" label="付款天数" align="center" />
      <el-table-column label="状态" align="center">
        <template #default="{ row }">
          <el-tag :type="row.onTime ? 'success' : 'danger'" size="small">{{ row.onTime ? '准时' : '逾期' }}</el-tag>
        </template>
      </el-table-column>
    </el-table>
  </el-dialog>
</div>

<script>
const { createApp, ref, nextTick } = Vue;
const app = createApp({
  setup() {
    const gaugeChartRef = ref(null);
    const radarChartRef = ref(null);
    const dialogVisible = ref(false);
    const currentRow = ref({ company: '', score: 0 });

    const creditData = ref([
      { rank: 1, company: 'YY建设集团', score: 92, barColor: '#67c23a', grade: 'A', gradeType: 'success', avgDays: '12天', overdueRate: '2%', disputeRate: '1%', trend: '↑', trendClass: 'trend-up' },
      { rank: 2, company: '某某贸易', score: 85, barColor: '#409eff', grade: 'B', gradeType: '', avgDays: '18天', overdueRate: '5%', disputeRate: '3%', trend: '↑', trendClass: 'trend-up' },
      { rank: 3, company: '某某制造', score: 78, barColor: '#409eff', grade: 'B', gradeType: '', avgDays: '25天', overdueRate: '8%', disputeRate: '5%', trend: '→', trendClass: 'trend-flat' },
      { rank: 4, company: 'ZZ贸易', score: 72, barColor: '#e6a23c', grade: 'C', gradeType: 'warning', avgDays: '32天', overdueRate: '15%', disputeRate: '8%', trend: '↓', trendClass: 'trend-down' },
      { rank: 5, company: '鑫达物流', score: 68, barColor: '#e6a23c', grade: 'C', gradeType: 'warning', avgDays: '35天', overdueRate: '18%', disputeRate: '10%', trend: '↓', trendClass: 'trend-down' },
      { rank: 6, company: '恒通建材', score: 65, barColor: '#e6a23c', grade: 'C', gradeType: 'warning', avgDays: '38天', overdueRate: '20%', disputeRate: '12%', trend: '→', trendClass: 'trend-flat' },
      { rank: 7, company: '华宇科技', score: 60, barColor: '#f56c6c', grade: 'D', gradeType: 'danger', avgDays: '42天', overdueRate: '25%', disputeRate: '15%', trend: '↓', trendClass: 'trend-down' },
      { rank: 8, company: '金诚矿业', score: 55, barColor: '#f56c6c', grade: 'D', gradeType: 'danger', avgDays: '45天', overdueRate: '28%', disputeRate: '18%', trend: '↓', trendClass: 'trend-down' },
      { rank: 9, company: '瑞丰化工', score: 48, barColor: '#f56c6c', grade: 'D', gradeType: 'danger', avgDays: '50天', overdueRate: '32%', disputeRate: '22%', trend: '↓', trendClass: 'trend-down' },
      { rank: 10, company: '天成机械', score: 42, barColor: '#f56c6c', grade: 'D', gradeType: 'danger', avgDays: '55天', overdueRate: '38%', disputeRate: '25%', trend: '↓', trendClass: 'trend-down' },
    ]);

    const paymentHistory = ref([
      { id: 'PM202503001', date: '2025-03-15', amount: '¥125,800', days: '10天', onTime: true },
      { id: 'PM202503006', date: '2025-03-10', amount: '¥89,500', days: '8天', onTime: true },
      { id: 'PM202502015', date: '2025-02-28', amount: '¥200,000', days: '15天', onTime: true },
      { id: 'PM202502008', date: '2025-02-15', amount: '¥67,200', days: '12天', onTime: true },
      { id: 'PM202501020', date: '2025-01-20', amount: '¥312,000', days: '18天', onTime: false },
    ]);

    let gaugeChart = null;
    let radarChart = null;

    const showDetail = (row) => {
      currentRow.value = row;
      dialogVisible.value = true;
    };

    const initCharts = () => {
      nextTick(() => {
        if (gaugeChartRef.value) {
          if (gaugeChart) gaugeChart.dispose();
          gaugeChart = echarts.init(gaugeChartRef.value);
          const score = currentRow.value.score;
          const color = score >= 80 ? '#67c23a' : score >= 60 ? '#e6a23c' : '#f56c6c';
          gaugeChart.setOption({
            series: [{
              type: 'gauge',
              startAngle: 220,
              endAngle: -40,
              min: 0,
              max: 100,
              pointer: { show: true, length: '60%', width: 5 },
              progress: { show: true, width: 16, roundCap: true },
              axisLine: { lineStyle: { width: 16, color: [[0.4, '#f56c6c'], [0.6, '#e6a23c'], [0.8, '#409eff'], [1, '#67c23a']] } },
              axisTick: { show: false },
              splitLine: { show: false },
              axisLabel: { show: false },
              detail: { valueAnimation: true, fontSize: 36, fontWeight: 700, offsetCenter: [0, '70%'], color: color, formatter: '{value}分' },
              title: { offsetCenter: [0, '95%'], fontSize: 14, color: '#909399' },
              data: [{ value: score, name: '信用评分' }]
            }]
          });
        }

        if (radarChartRef.value) {
          if (radarChart) radarChart.dispose();
          radarChart = echarts.init(radarChartRef.value);
          const score = currentRow.value.score;
          const factor = score / 92;
          radarChart.setOption({
            radar: {
              indicator: [
                { name: '准时率', max: 100 },
                { name: '付款天数', max: 100 },
                { name: '逾期率', max: 100 },
                { name: '异议率', max: 100 },
                { name: '合作时长', max: 100 },
                { name: '交易规模', max: 100 },
              ],
              shape: 'polygon',
              splitNumber: 4,
              axisName: { color: '#606266', fontSize: 12 },
            },
            series: [{
              type: 'radar',
              data: [{
                value: [
                  Math.round(95 * factor),
                  Math.round(88 * factor),
                  Math.round(92 * factor),
                  Math.round(90 * factor),
                  Math.round(75 * factor),
                  Math.round(82 * factor),
                ],
                name: currentRow.value.company,
                areaStyle: { opacity: 0.2 },
                lineStyle: { width: 2 },
              }]
            }]
          });
        }
      });
    };

    return { creditData, dialogVisible, currentRow, paymentHistory, showDetail, initCharts, gaugeChartRef, radarChartRef };
  }
});
for (const [key, component] of Object.entries(ElementPlusIconsVue)) {
  app.component(key, component);
}
app.use(ElementPlus);
app.mount('#app');
</script>
</body>
</html>
