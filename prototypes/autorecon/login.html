<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录页 - 对账通原型</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/element-plus@2.9.1/dist/index.css">
  <script src="https://cdn.jsdelivr.net/npm/vue@3.5.13/dist/vue.global.prod.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/element-plus@2.9.1/dist/index.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@element-plus/icons-vue@2.3.1/dist/index.iife.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
      position: relative;
      overflow: hidden;
    }
    body::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background:
        radial-gradient(circle at 20% 30%, rgba(255,255,255,0.12) 0%, transparent 50%),
        radial-gradient(circle at 80% 70%, rgba(255,255,255,0.08) 0%, transparent 40%),
        radial-gradient(circle at 50% 50%, rgba(255,255,255,0.05) 0%, transparent 60%);
      pointer-events: none;
    }
    .floating-shape {
      position: absolute;
      border-radius: 50%;
      opacity: 0.06;
      background: #fff;
      pointer-events: none;
    }
    .shape-1 { width: 400px; height: 400px; top: -100px; left: -100px; }
    .shape-2 { width: 300px; height: 300px; bottom: -80px; right: -60px; }
    .shape-3 { width: 200px; height: 200px; top: 40%; right: 10%; }

    .login-card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3), 0 0 40px rgba(102,126,234,0.2);
      width: 100%;
      max-width: 420px;
      padding: 40px 36px 36px;
      position: relative;
      z-index: 10;
      overflow: hidden;
    }
    .demo-banner {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      background: linear-gradient(135deg, #e6a23c, #f39c12);
      color: #fff;
      text-align: center;
      padding: 6px 0;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 2px;
    }
    .logo-area {
      text-align: center;
      margin-top: 16px;
      margin-bottom: 28px;
    }
    .logo-box {
      width: 80px;
      height: 80px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      border-radius: 20px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
      box-shadow: 0 8px 24px rgba(102,126,234,0.35);
    }
    .logo-box svg {
      width: 44px;
      height: 44px;
      fill: #fff;
    }
    .logo-area h1 {
      font-size: 24px;
      font-weight: 700;
      color: #303133;
      margin-bottom: 6px;
    }
    .logo-area p {
      font-size: 14px;
      color: #909399;
      letter-spacing: 4px;
    }
    .login-form {
      margin-bottom: 20px;
    }
    .login-form .el-input {
      margin-bottom: 0;
    }
    .form-item {
      margin-bottom: 20px;
    }
    .remember-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
    }
    .login-btn {
      width: 100%;
      height: 44px;
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 8px;
      border-radius: 8px;
    }
    .demo-section {
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px dashed #e4e7ed;
    }
    .demo-title {
      font-size: 13px;
      color: #909399;
      margin-bottom: 12px;
      text-align: center;
    }
    .demo-account {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      background: #f5f7fa;
      border-radius: 8px;
      margin-bottom: 8px;
      cursor: pointer;
      transition: all 0.2s;
      border: 1px solid transparent;
    }
    .demo-account:hover {
      background: #ecf5ff;
      border-color: #409eff;
    }
    .demo-account:last-child { margin-bottom: 0; }
    .demo-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .demo-user {
      font-size: 13px;
      font-weight: 600;
      color: #303133;
    }
    .demo-pass {
      font-size: 12px;
      color: #909399;
    }
    .demo-role {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 4px;
      white-space: nowrap;
    }
    .role-admin { background: #fdf6ec; color: #e6a23c; }
    .role-seller { background: #ecf5ff; color: #409eff; }
    .role-buyer { background: #f0f9eb; color: #67c23a; }
    .back-link {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: rgba(255,255,255,0.7);
      font-size: 13px;
      text-decoration: none;
      position: relative;
      z-index: 10;
    }
    .back-link:hover { color: #fff; }
  </style>
</head>
<body>
  <div class="floating-shape shape-1"></div>
  <div class="floating-shape shape-2"></div>
  <div class="floating-shape shape-3"></div>

  <div id="app">
    <div>
      <div class="login-card">
        <div class="demo-banner">Demo Mode</div>
        <div class="logo-area">
          <div class="logo-box">
            <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-2 10h-4v4h-2v-4H7v-2h4V7h2v4h4v2z"/></svg>
          </div>
          <h1>自动对账系统</h1>
          <p>智能对账 · 高效协同</p>
        </div>

        <div class="login-form">
          <div class="form-item">
            <el-input
              v-model="form.username"
              placeholder="请输入用户名"
              size="large"
              :prefix-icon="UserIcon"
              clearable
            />
          </div>
          <div class="form-item">
            <el-input
              v-model="form.password"
              placeholder="请输入密码"
              size="large"
              type="password"
              show-password
              :prefix-icon="LockIcon"
            />
          </div>
          <div class="remember-row">
            <el-checkbox v-model="form.remember">记住我</el-checkbox>
          </div>
          <el-button type="primary" class="login-btn" @click="handleLogin" :loading="loading">
            登 录
          </el-button>
        </div>

        <div class="demo-section">
          <div class="demo-title">演示账号（点击自动填充）</div>
          <div class="demo-account" v-for="account in demoAccounts" :key="account.username" @click="fillAccount(account)">
            <div class="demo-left">
              <span class="demo-user">{{ account.username }}</span>
              <span class="demo-pass">/ {{ account.password }}</span>
            </div>
            <span class="demo-role" :class="account.roleClass">{{ account.role }}</span>
          </div>
        </div>
      </div>
      <a href="index.html" class="back-link">← 返回原型导航</a>
    </div>
  </div>

  <script>
    const { createApp, shallowRef } = Vue;

    const app = createApp({
      setup() {
        const UserIcon = shallowRef(ElementPlusIconsVue.User);
        const LockIcon = shallowRef(ElementPlusIconsVue.Lock);
        return { UserIcon, LockIcon };
      },
      data() {
        return {
          loading: false,
          form: {
            username: '',
            password: '',
            remember: false
          },
          demoAccounts: [
            { username: 'admin', password: 'admin123', role: '平台运营', roleClass: 'role-admin' },
            { username: 'seller1', password: '123456', role: '卖方管理员', roleClass: 'role-seller' },
            { username: 'buyer1', password: '123456', role: '买方管理员', roleClass: 'role-buyer' },
          ]
        };
      },
      methods: {
        fillAccount(account) {
          this.form.username = account.username;
          this.form.password = account.password;
        },
        handleLogin() {
          if (!this.form.username || !this.form.password) {
            ElementPlus.ElMessage.warning('请输入用户名和密码');
            return;
          }
          this.loading = true;
          setTimeout(() => {
            this.loading = false;
            ElementPlus.ElMessage.success('登录成功，正在跳转...');
            setTimeout(() => {
              window.location.href = 'dashboard.html';
            }, 800);
          }, 1000);
        }
      }
    });

    for (const [key, component] of Object.entries(ElementPlusIconsVue)) {
      app.component(key, component);
    }
    app.use(ElementPlus);
    app.mount('#app');
  </script>
</body>
</html>
