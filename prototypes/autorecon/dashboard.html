<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>工作台 - 对账通原型</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/element-plus@2.9.1/dist/index.css">
  <script src="https://cdn.jsdelivr.net/npm/vue@3.5.13/dist/vue.global.prod.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/element-plus@2.9.1/dist/index.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@element-plus/icons-vue@2.3.1/dist/index.iife.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body, #app { height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
      background: #f0f2f5;
    }
    .layout { display: flex; height: 100%; }

    /* Sidebar */
    .sidebar {
      width: 220px;
      min-width: 220px;
      background: #001529;
      height: 100%;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      transition: width 0.3s;
    }
    .sidebar.collapsed {
      width: 64px;
      min-width: 64px;
    }
    .sidebar-logo {
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 16px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    .sidebar-logo .logo-icon {
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, #409eff, #667eea);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .sidebar-logo .logo-icon svg {
      width: 20px;
      height: 20px;
      fill: #fff;
    }
    .sidebar-logo .logo-text {
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      margin-left: 10px;
      white-space: nowrap;
      letter-spacing: 2px;
    }
    .sidebar.collapsed .logo-text { display: none; }

    .sidebar-menu {
      flex: 1;
      padding: 8px 0;
    }
    .menu-group {
      margin-bottom: 4px;
    }
    .menu-group-title {
      padding: 12px 20px 6px;
      font-size: 11px;
      color: rgba(255,255,255,0.35);
      text-transform: uppercase;
      letter-spacing: 2px;
      white-space: nowrap;
      overflow: hidden;
    }
    .sidebar.collapsed .menu-group-title {
      text-align: center;
      padding: 12px 4px 6px;
      font-size: 9px;
    }
    .menu-item {
      display: flex;
      align-items: center;
      padding: 10px 20px;
      color: rgba(255,255,255,0.65);
      text-decoration: none;
      font-size: 14px;
      transition: all 0.2s;
      cursor: pointer;
      border-left: 3px solid transparent;
      gap: 10px;
    }
    .menu-item:hover {
      color: #fff;
      background: rgba(255,255,255,0.06);
    }
    .menu-item.active {
      color: #fff;
      background: rgba(64,158,255,0.15);
      border-left-color: #409eff;
    }
    .menu-item .item-icon {
      width: 18px;
      text-align: center;
      flex-shrink: 0;
      font-size: 15px;
    }
    .menu-item .item-text {
      white-space: nowrap;
    }
    .sidebar.collapsed .item-text { display: none; }
    .sidebar.collapsed .menu-item { justify-content: center; padding: 10px 0; }

    /* Main */
    .main-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .top-header {
      height: 56px;
      background: #fff;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      z-index: 10;
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .toggle-btn {
      cursor: pointer;
      font-size: 18px;
      color: #606266;
      display: flex;
      align-items: center;
      padding: 4px;
      border-radius: 4px;
      transition: background 0.2s;
    }
    .toggle-btn:hover { background: #f5f7fa; }
    .header-right {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .company-name {
      font-size: 14px;
      color: #606266;
    }
    .user-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: linear-gradient(135deg, #409eff, #667eea);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    /* Content */
    .content-area {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
    }
    .page-title {
      font-size: 22px;
      font-weight: 700;
      color: #303133;
      margin-bottom: 24px;
    }

    /* Stat Cards */
    .stat-cards {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 16px;
      margin-bottom: 24px;
    }
    .stat-card {
      background: #fff;
      border-radius: 12px;
      padding: 20px;
      display: flex;
      align-items: center;
      gap: 16px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.04);
      transition: transform 0.2s;
    }
    .stat-card:hover { transform: translateY(-2px); }
    .stat-icon {
      width: 52px;
      height: 52px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      flex-shrink: 0;
    }
    .stat-icon.blue { background: linear-gradient(135deg, #409eff, #667eea); color: #fff; }
    .stat-icon.orange { background: linear-gradient(135deg, #e6a23c, #f39c12); color: #fff; }
    .stat-icon.purple { background: linear-gradient(135deg, #764ba2, #9b59b6); color: #fff; }
    .stat-icon.red { background: linear-gradient(135deg, #f56c6c, #e74c3c); color: #fff; }
    .stat-icon.green { background: linear-gradient(135deg, #67c23a, #2ecc71); color: #fff; }
    .stat-info {}
    .stat-label {
      font-size: 13px;
      color: #909399;
      margin-bottom: 4px;
    }
    .stat-value {
      font-size: 28px;
      font-weight: 700;
      color: #303133;
    }

    /* Charts */
    .charts-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 24px;
    }
    .chart-card {
      background: #fff;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.04);
    }
    .chart-title {
      font-size: 16px;
      font-weight: 600;
      color: #303133;
      margin-bottom: 16px;
    }
    .chart-container {
      height: 280px;
    }

    /* Table */
    .table-card {
      background: #fff;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.04);
    }
    .table-title {
      font-size: 16px;
      font-weight: 600;
      color: #303133;
      margin-bottom: 16px;
    }

    @media (max-width: 1200px) {
      .stat-cards { grid-template-columns: repeat(3, 1fr); }
      .charts-row { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div id="app">
    <div class="layout">
      <!-- Sidebar -->
      <div class="sidebar" :class="{ collapsed: sidebarCollapsed }">
        <div class="sidebar-logo">
          <div class="logo-icon">
            <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-2 10h-4v4h-2v-4H7v-2h4V7h2v4h4v2z"/></svg>
          </div>
          <span class="logo-text">自动对账</span>
        </div>
        <div class="sidebar-menu">
          <div class="menu-group" v-for="group in menuGroups" :key="group.label">
            <div class="menu-group-title">{{ group.label }}</div>
            <a
              v-for="item in group.items"
              :key="item.text"
              :href="item.link"
              class="menu-item"
              :class="{ active: item.active }"
            >
              <span class="item-icon">{{ item.icon }}</span>
              <span class="item-text">{{ item.text }}</span>
            </a>
          </div>
        </div>
      </div>

      <!-- Main Area -->
      <div class="main-area">
        <!-- Header -->
        <div class="top-header">
          <div class="header-left">
            <div class="toggle-btn" @click="sidebarCollapsed = !sidebarCollapsed">
              <el-icon :size="20"><Fold v-if="!sidebarCollapsed" /><Expand v-else /></el-icon>
            </div>
            <el-breadcrumb separator="/">
              <el-breadcrumb-item>首页</el-breadcrumb-item>
              <el-breadcrumb-item>工作台</el-breadcrumb-item>
            </el-breadcrumb>
          </div>
          <div class="header-right">
            <span class="company-name">某某钢铁有限公司</span>
            <el-dropdown trigger="click">
              <div class="user-avatar">管</div>
              <template #dropdown>
                <el-dropdown-menu>
                  <el-dropdown-item>个人信息</el-dropdown-item>
                  <el-dropdown-item>修改密码</el-dropdown-item>
                  <el-dropdown-item divided @click="logout">退出登录</el-dropdown-item>
                </el-dropdown-menu>
              </template>
            </el-dropdown>
          </div>
        </div>

        <!-- Content -->
        <div class="content-area">
          <div class="page-title">工作台</div>

          <!-- Stat Cards -->
          <div class="stat-cards">
            <div class="stat-card" v-for="stat in stats" :key="stat.label">
              <div class="stat-icon" :class="stat.color">
                <span>{{ stat.icon }}</span>
              </div>
              <div class="stat-info">
                <div class="stat-label">{{ stat.label }}</div>
                <div class="stat-value">{{ stat.value }}</div>
              </div>
            </div>
          </div>

          <!-- Charts Row -->
          <div class="charts-row">
            <div class="chart-card">
              <div class="chart-title">月度对账完成率</div>
              <div class="chart-container" id="gaugeChart"></div>
            </div>
            <div class="chart-card">
              <div class="chart-title">应收账款趋势</div>
              <div class="chart-container" id="barChart"></div>
            </div>
          </div>

          <!-- Todo Table -->
          <div class="table-card">
            <div class="table-title">待办事项</div>
            <el-table :data="todoList" stripe style="width: 100%">
              <el-table-column prop="id" label="对账单号" width="140" />
              <el-table-column prop="company" label="客户名称" min-width="180" />
              <el-table-column prop="status" label="状态" width="120">
                <template #default="scope">
                  <el-tag :type="scope.row.tagType" size="small" effect="light">
                    {{ scope.row.status }}
                  </el-tag>
                </template>
              </el-table-column>
              <el-table-column prop="time" label="更新时间" width="170" />
              <el-table-column label="操作" width="100" fixed="right">
                <template #default="scope">
                  <el-button type="primary" link size="small">{{ scope.row.action }}</el-button>
                </template>
              </el-table-column>
            </el-table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const { createApp } = Vue;

    const app = createApp({
      data() {
        return {
          sidebarCollapsed: false,
          stats: [
            { label: '待处理', value: 12, icon: '📋', color: 'blue' },
            { label: '异议中', value: 3, icon: '⚠️', color: 'orange' },
            { label: '待签章', value: 5, icon: '✍️', color: 'purple' },
            { label: '催收中', value: 8, icon: '📞', color: 'red' },
            { label: '本月完成', value: 42, icon: '✅', color: 'green' },
          ],
          todoList: [
            { id: 'R202503001', company: '某某贸易有限公司', status: '待审核', tagType: 'warning', time: '2025-03-17 10:30', action: '处理' },
            { id: 'R202503002', company: '某某制造有限公司', status: '待签章', tagType: '', time: '2025-03-16 14:20', action: '签章' },
            { id: 'R202503003', company: '某某科技股份有限公司', status: '异议中', tagType: 'danger', time: '2025-03-16 09:15', action: '处理' },
            { id: 'R202503004', company: '某某建材有限公司', status: '催收中', tagType: 'warning', time: '2025-03-15 16:45', action: '催收' },
            { id: 'R202503005', company: '某某物流有限公司', status: '已生成', tagType: 'info', time: '2025-03-15 11:00', action: '处理' },
          ],
          menuGroups: [
            {
              label: '概览',
              items: [
                { icon: '🏠', text: '工作台', link: 'dashboard.html', active: true },
              ]
            },
            {
              label: '对账管理',
              items: [
                { icon: '📋', text: '对账单列表', link: 'recon-list.html', active: false },
                { icon: '✏️', text: '发起对账', link: 'recon-create.html', active: false },
                { icon: '🔍', text: '比对结果', link: 'recon-compare.html', active: false },
              ]
            },
            {
              label: '财务管理',
              items: [
                { icon: '💰', text: '付款管理', link: 'payment.html', active: false },
                { icon: '📞', text: '催收管理', link: 'collection.html', active: false },
                { icon: '⭐', text: '信用评分', link: 'credit-score.html', active: false },
              ]
            },
            {
              label: '签章管理',
              items: [
                { icon: '✍️', text: '待签章', link: 'pending-sign.html', active: false },
              ]
            },
            {
              label: '数据分析',
              items: [
                { icon: '📈', text: '数据看板', link: 'analytics.html', active: false },
              ]
            },
            {
              label: '系统管理',
              items: [
                { icon: '⚙️', text: '系统设置', link: 'settings.html', active: false },
              ]
            },
          ]
        };
      },
      methods: {
        logout() {
          window.location.href = 'login.html';
        }
      },
      mounted() {
        this.$nextTick(() => {
          this.initGaugeChart();
          this.initBarChart();
        });
      },
      methods: {
        logout() {
          window.location.href = 'login.html';
        },
        initGaugeChart() {
          const chart = echarts.init(document.getElementById('gaugeChart'));
          const option = {
            series: [
              {
                type: 'gauge',
                startAngle: 180,
                endAngle: 0,
                center: ['50%', '70%'],
                radius: '100%',
                min: 0,
                max: 100,
                splitNumber: 10,
                axisLine: {
                  lineStyle: {
                    width: 20,
                    color: [
                      [0.3, '#f56c6c'],
                      [0.7, '#e6a23c'],
                      [1, '#409eff']
                    ]
                  }
                },
                pointer: {
                  icon: 'path://M12.8,0.7l12,40.1H0.7L12.8,0.7z',
                  length: '55%',
                  width: 8,
                  offsetCenter: [0, '-10%'],
                  itemStyle: {
                    color: '#409eff'
                  }
                },
                axisTick: {
                  length: 6,
                  lineStyle: { color: 'auto', width: 1 }
                },
                splitLine: {
                  length: 12,
                  lineStyle: { color: 'auto', width: 2 }
                },
                axisLabel: {
                  color: '#909399',
                  fontSize: 11,
                  distance: -40,
                  rotate: 'tangential',
                  formatter: function (value) {
                    if (value === 0 || value === 50 || value === 100) return value + '%';
                    return '';
                  }
                },
                title: {
                  offsetCenter: [0, '20%'],
                  fontSize: 14,
                  color: '#909399'
                },
                detail: {
                  fontSize: 36,
                  offsetCenter: [0, '-5%'],
                  valueAnimation: true,
                  formatter: '{value}%',
                  color: '#409eff',
                  fontWeight: 700
                },
                data: [
                  {
                    value: 78,
                    name: '完成率'
                  }
                ]
              }
            ]
          };
          chart.setOption(option);
          window.addEventListener('resize', () => chart.resize());
        },
        initBarChart() {
          const chart = echarts.init(document.getElementById('barChart'));
          const option = {
            tooltip: {
              trigger: 'axis',
              axisPointer: { type: 'shadow' },
              formatter: '{b}<br/>{a}: {c} 万元'
            },
            grid: {
              left: '3%',
              right: '4%',
              bottom: '3%',
              top: '10%',
              containLabel: true
            },
            xAxis: {
              type: 'category',
              data: ['09月', '10月', '11月', '12月', '01月', '02月'],
              axisLine: { lineStyle: { color: '#dcdfe6' } },
              axisLabel: { color: '#606266' },
              axisTick: { show: false }
            },
            yAxis: {
              type: 'value',
              name: '万元',
              nameTextStyle: { color: '#909399' },
              axisLine: { show: false },
              axisTick: { show: false },
              axisLabel: { color: '#909399' },
              splitLine: { lineStyle: { color: '#f0f2f5', type: 'dashed' } }
            },
            series: [
              {
                name: '应收账款',
                type: 'bar',
                barWidth: '45%',
                data: [320, 450, 380, 520, 410, 480],
                itemStyle: {
                  borderRadius: [6, 6, 0, 0],
                  color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
                    { offset: 0, color: '#409eff' },
                    { offset: 1, color: '#a0cfff' }
                  ])
                },
                emphasis: {
                  itemStyle: {
                    color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
                      { offset: 0, color: '#337ecc' },
                      { offset: 1, color: '#79bbff' }
                    ])
                  }
                }
              }
            ]
          };
          chart.setOption(option);
          window.addEventListener('resize', () => chart.resize());
        }
      }
    });

    for (const [key, component] of Object.entries(ElementPlusIconsVue)) {
      app.component(key, component);
    }
    app.use(ElementPlus);
    app.mount('#app');
  </script>
</body>
</html>
