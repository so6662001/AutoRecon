<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>比对结果 - 对账通原型</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/element-plus@2.9.1/dist/index.css">
  <script src="https://cdn.jsdelivr.net/npm/vue@3.5.13/dist/vue.global.prod.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/element-plus@2.9.1/dist/index.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@element-plus/icons-vue@2.3.1/dist/index.iife.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif; background: #f0f2f5; }
    .layout { display: flex; min-height: 100vh; }

    .sidebar { width: 220px; background: #001529; color: #fff; flex-shrink: 0; display: flex; flex-direction: column; position: fixed; top: 0; left: 0; bottom: 0; z-index: 100; overflow-y: auto; }
    .sidebar-logo { height: 60px; display: flex; align-items: center; justify-content: center; border-bottom: 1px solid rgba(255,255,255,0.08); }
    .sidebar-logo h1 { font-size: 18px; color: #fff; font-weight: 600; letter-spacing: 1px; }
    .sidebar-logo span { color: #409eff; }
    .sidebar-menu { flex: 1; padding: 8px 0; }
    .menu-group { margin-bottom: 4px; }
    .menu-group-title { padding: 10px 20px 6px; font-size: 12px; color: rgba(255,255,255,0.35); text-transform: uppercase; letter-spacing: 1px; }
    .menu-item { display: flex; align-items: center; padding: 10px 20px 10px 28px; color: rgba(255,255,255,0.65); text-decoration: none; font-size: 14px; transition: all 0.2s; cursor: pointer; }
    .menu-item:hover { color: #fff; background: rgba(255,255,255,0.06); }
    .menu-item.active { color: #fff; background: #409eff; }
    .menu-item .icon { margin-right: 8px; font-size: 16px; width: 16px; text-align: center; }
    .menu-sub .menu-item { padding-left: 44px; font-size: 13px; }

    .main-area { margin-left: 220px; flex: 1; display: flex; flex-direction: column; min-height: 100vh; }
    .header { height: 60px; background: #fff; border-bottom: 1px solid #e8e8e8; display: flex; align-items: center; justify-content: space-between; padding: 0 24px; position: sticky; top: 0; z-index: 99; }
    .header-left { display: flex; align-items: center; gap: 16px; }
    .header-breadcrumb { font-size: 14px; color: #666; }
    .header-right { display: flex; align-items: center; gap: 16px; }
    .header-avatar { width: 32px; height: 32px; border-radius: 50%; background: #409eff; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 14px; }
    .header-user { font-size: 14px; color: #333; }

    .content { flex: 1; padding: 20px 24px; }
    .card { background: #fff; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); padding: 20px; margin-bottom: 16px; }

    .page-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
    .page-header-left { display: flex; align-items: center; gap: 12px; }
    .page-header-left h2 { font-size: 20px; font-weight: 600; color: #1a1a1a; }
    .page-header-right { display: flex; gap: 8px; }

    .stat-cards { display: flex; gap: 16px; margin-bottom: 20px; }
    .stat-card { flex: 1; border-radius: 8px; padding: 16px 20px; text-align: center; }
    .stat-card .stat-num { font-size: 28px; font-weight: 700; margin-bottom: 4px; }
    .stat-card .stat-label { font-size: 13px; }
    .stat-card.green { background: #f0f9eb; }
    .stat-card.green .stat-num { color: #67c23a; }
    .stat-card.green .stat-label { color: #67c23a; }
    .stat-card.orange { background: #fdf6ec; }
    .stat-card.orange .stat-num { color: #e6a23c; }
    .stat-card.orange .stat-label { color: #e6a23c; }
    .stat-card.blue { background: #ecf5ff; }
    .stat-card.blue .stat-num { color: #409eff; }
    .stat-card.blue .stat-label { color: #409eff; }
    .stat-card.red { background: #fef0f0; }
    .stat-card.red .stat-num { color: #f56c6c; }
    .stat-card.red .stat-label { color: #f56c6c; }
    .stat-card.rate { background: #fff; border: 2px solid #409eff; }
    .stat-card.rate .stat-num { color: #409eff; }
    .stat-card.rate .stat-label { color: #409eff; }

    .diff-val { color: #f56c6c; font-weight: 600; }
    .match-val { color: #67c23a; }

    .bottom-action-bar { background: #fff; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); padding: 16px 20px; display: flex; justify-content: flex-end; gap: 12px; }
  </style>
</head>
<body>
<div id="app">
  <div class="layout">
    <aside class="sidebar">
      <div class="sidebar-logo">
        <h1><span>Auto</span>Recon 对账通</h1>
      </div>
      <nav class="sidebar-menu">
        <div class="menu-group">
          <a class="menu-item" href="dashboard.html"><span class="icon">📊</span>工作台</a>
        </div>
        <div class="menu-group">
          <div class="menu-group-title">对账管理</div>
          <div class="menu-sub">
            <a class="menu-item active" href="bill-list.html"><span class="icon">📋</span>对账单列表</a>
            <a class="menu-item" href="bill-create.html"><span class="icon">✏️</span>发起对账</a>
            <a class="menu-item" href="#"><span class="icon">📦</span>批量对账</a>
            <a class="menu-item" href="#"><span class="icon">📤</span>买方数据上传</a>
          </div>
        </div>
        <div class="menu-group">
          <div class="menu-group-title">异议处理</div>
          <div class="menu-sub">
            <a class="menu-item" href="#"><span class="icon">⚠️</span>异议列表</a>
          </div>
        </div>
        <div class="menu-group">
          <div class="menu-group-title">签章管理</div>
          <div class="menu-sub">
            <a class="menu-item" href="sign-pending.html"><span class="icon">✍️</span>待签章</a>
            <a class="menu-item" href="#"><span class="icon">🔏</span>印章管理</a>
          </div>
        </div>
        <div class="menu-group">
          <div class="menu-group-title">财务管理</div>
          <div class="menu-sub">
            <a class="menu-item" href="payment.html"><span class="icon">💰</span>付款管理</a>
            <a class="menu-item" href="#"><span class="icon">🧾</span>发票管理</a>
            <a class="menu-item" href="#"><span class="icon">📞</span>催收管理</a>
            <a class="menu-item" href="credit.html"><span class="icon">⭐</span>信用评分</a>
          </div>
        </div>
        <div class="menu-group">
          <div class="menu-group-title">数据分析</div>
          <div class="menu-sub">
            <a class="menu-item" href="analytics.html"><span class="icon">📈</span>数据分析</a>
          </div>
        </div>
        <div class="menu-group">
          <div class="menu-group-title">系统设置</div>
          <div class="menu-sub">
            <a class="menu-item" href="settings.html"><span class="icon">⚙️</span>系统设置</a>
          </div>
        </div>
      </nav>
    </aside>

    <div class="main-area">
      <header class="header">
        <div class="header-left">
          <el-button text @click="location.href='bill-detail.html?id=R202503001'"><el-icon><arrow-left /></el-icon></el-button>
          <span class="header-breadcrumb">对账管理 / 对账单详情 / 比对结果</span>
        </div>
        <div class="header-right">
          <el-badge :value="3" :max="99">
            <el-icon :size="20"><bell /></el-icon>
          </el-badge>
          <div class="header-avatar">张</div>
          <span class="header-user">张经理</span>
        </div>
      </header>

      <div class="content">
        <!-- Page Header -->
        <div class="page-header">
          <div class="page-header-left">
            <h2>比对结果</h2>
            <el-tag effect="plain">R202503001</el-tag>
          </div>
          <div class="page-header-right">
            <el-button type="primary"><el-icon style="margin-right:4px"><refresh /></el-icon>发起比对</el-button>
            <el-button>重新比对</el-button>
          </div>
        </div>

        <!-- Stat Cards -->
        <div class="stat-cards">
          <div class="stat-card green">
            <div class="stat-num">8</div>
            <div class="stat-label">匹配</div>
          </div>
          <div class="stat-card orange">
            <div class="stat-num">3</div>
            <div class="stat-label">差异</div>
          </div>
          <div class="stat-card blue">
            <div class="stat-num">1</div>
            <div class="stat-label">卖方多出</div>
          </div>
          <div class="stat-card red">
            <div class="stat-num">1</div>
            <div class="stat-label">买方多出</div>
          </div>
          <div class="stat-card rate">
            <div class="stat-num">61.5%</div>
            <div class="stat-label">匹配率</div>
          </div>
        </div>

        <!-- Filter Tabs -->
        <div class="card" style="padding: 0;">
          <div style="padding: 12px 20px 0; border-bottom: 1px solid #eee;">
            <el-radio-group v-model="filterType" size="default" style="margin-bottom: -1px;">
              <el-radio-button value="all">全部(13)</el-radio-button>
              <el-radio-button value="diff">仅差异(3)</el-radio-button>
              <el-radio-button value="sellerExtra">卖方多出(1)</el-radio-button>
              <el-radio-button value="buyerExtra">买方多出(1)</el-radio-button>
            </el-radio-group>
          </div>

          <!-- Table -->
          <el-table :data="filteredData" stripe style="width: 100%" header-cell-style="background:#fafafa;color:#333;font-weight:600" :row-class-name="rowClassName">
            <el-table-column prop="index" label="序号" width="60" align="center" />
            <el-table-column prop="contractNo" label="合同号" width="110" />
            <el-table-column prop="product" label="品名" width="90" />
            <el-table-column prop="spec" label="规格" width="80" />
            <el-table-column prop="sellerWeight" label="卖方重量(吨)" width="120" align="right" />
            <el-table-column prop="buyerWeight" label="买方重量(吨)" width="120" align="right" />
            <el-table-column label="重量差异(吨)" width="120" align="right">
              <template #default="{ row }">
                <span :class="{ 'diff-val': row.weightDiff !== 0 && row.weightDiff !== '-' }">
                  {{ row.weightDiff === 0 ? '0' : row.weightDiff }}
                </span>
              </template>
            </el-table-column>
            <el-table-column label="差异归因" width="110" align="center">
              <template #default="{ row }">
                <el-tag v-if="row.reason && row.reason !== '-'" :type="reasonType(row.reason)" size="small" effect="plain">{{ row.reason }}</el-tag>
                <span v-else style="color:#ccc">-</span>
              </template>
            </el-table-column>
            <el-table-column prop="sellerAmount" label="卖方金额" width="110" align="right" />
            <el-table-column prop="buyerAmount" label="买方金额" width="110" align="right" />
            <el-table-column label="金额差异" width="100" align="right">
              <template #default="{ row }">
                <span :class="{ 'diff-val': row.amountDiff !== 0 && row.amountDiff !== '-' }">
                  {{ row.amountDiff === 0 ? '0' : row.amountDiff }}
                </span>
              </template>
            </el-table-column>
            <el-table-column label="状态" width="110" align="center" fixed="right">
              <template #default="{ row }">
                <el-tag :type="statusType(row.status)" size="small" effect="light">{{ row.statusLabel }}</el-tag>
              </template>
            </el-table-column>
          </el-table>
        </div>

        <!-- Bottom Action Bar -->
        <div class="bottom-action-bar">
          <el-button type="success">全部确认</el-button>
          <el-button type="warning">标记差异为异议</el-button>
          <el-button>导出比对报告</el-button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
const { createApp, ref, computed } = Vue;
const app = createApp({
  setup() {
    const filterType = ref('all');

    const allData = ref([
      { index: 1,  contractNo: 'HT2025001', product: '螺纹钢',   spec: 'Φ20',     sellerWeight: 2.50,  buyerWeight: 2.50,  weightDiff: 0,     reason: '-',       sellerAmount: '¥11,250',  buyerAmount: '¥11,250',  amountDiff: 0,    status: 'match',       statusLabel: '匹配 ✓' },
      { index: 2,  contractNo: 'HT2025001', product: '盘螺',     spec: 'Φ10',     sellerWeight: 1.20,  buyerWeight: 1.18,  weightDiff: -0.02, reason: '磅差',     sellerAmount: '¥5,040',   buyerAmount: '¥4,956',   amountDiff: -84,  status: 'diff',        statusLabel: '差异 ⚠' },
      { index: 3,  contractNo: 'HT2025002', product: '热轧卷板', spec: '3.0mm',   sellerWeight: 8.60,  buyerWeight: 8.45,  weightDiff: -0.15, reason: '运输损耗', sellerAmount: '¥35,260',  buyerAmount: '¥34,645',  amountDiff: -615, status: 'diff',        statusLabel: '差异 ⚠' },
      { index: 4,  contractNo: 'HT2025002', product: '冷轧板',   spec: '1.5mm',   sellerWeight: 5.80,  buyerWeight: 5.80,  weightDiff: 0,     reason: '-',       sellerAmount: '¥30,160',  buyerAmount: '¥30,160',  amountDiff: 0,    status: 'match',       statusLabel: '匹配 ✓' },
      { index: 5,  contractNo: 'HT2025003', product: 'H型钢',    spec: '200×200', sellerWeight: 10.50, buyerWeight: 10.50, weightDiff: 0,     reason: '-',       sellerAmount: '¥43,890',  buyerAmount: '¥43,890',  amountDiff: 0,    status: 'match',       statusLabel: '匹配 ✓' },
      { index: 6,  contractNo: 'HT2025003', product: '角钢',     spec: '50×50',   sellerWeight: 3.20,  buyerWeight: 3.20,  weightDiff: 0,     reason: '-',       sellerAmount: '¥13,120',  buyerAmount: '¥13,120',  amountDiff: 0,    status: 'match',       statusLabel: '匹配 ✓' },
      { index: 7,  contractNo: 'HT2025004', product: '镀锌管',   spec: 'DN50',    sellerWeight: 4.50,  buyerWeight: 4.50,  weightDiff: 0,     reason: '-',       sellerAmount: '¥24,750',  buyerAmount: '¥24,750',  amountDiff: 0,    status: 'match',       statusLabel: '匹配 ✓' },
      { index: 8,  contractNo: 'HT2025004', product: '方管',     spec: '40×40',   sellerWeight: 2.80,  buyerWeight: 2.80,  weightDiff: 0,     reason: '-',       sellerAmount: '¥15,960',  buyerAmount: '¥15,960',  amountDiff: 0,    status: 'match',       statusLabel: '匹配 ✓' },
      { index: 9,  contractNo: 'HT2025005', product: '槽钢',     spec: '10#',     sellerWeight: 6.00,  buyerWeight: 5.92,  weightDiff: -0.08, reason: '含水量差异', sellerAmount: '¥25,200', buyerAmount: '¥24,864', amountDiff: -336, status: 'diff',        statusLabel: '差异 ⚠' },
      { index: 10, contractNo: 'HT2025005', product: '工字钢',   spec: '16#',     sellerWeight: 7.20,  buyerWeight: 7.20,  weightDiff: 0,     reason: '-',       sellerAmount: '¥31,680',  buyerAmount: '¥31,680',  amountDiff: 0,    status: 'match',       statusLabel: '匹配 ✓' },
      { index: 11, contractNo: 'HT2025005', product: '扁钢',     spec: '30×3',    sellerWeight: 1.60,  buyerWeight: 1.60,  weightDiff: 0,     reason: '-',       sellerAmount: '¥6,880',   buyerAmount: '¥6,880',   amountDiff: 0,    status: 'match',       statusLabel: '匹配 ✓' },
      { index: 12, contractNo: 'HT2025006', product: '花纹板',   spec: '4.0mm',   sellerWeight: 3.40,  buyerWeight: '-',   weightDiff: '-',   reason: '-',       sellerAmount: '¥15,300',  buyerAmount: '-',        amountDiff: '-',  status: 'sellerExtra', statusLabel: '卖方多出' },
      { index: 13, contractNo: '-',         product: '圆钢',     spec: 'Φ16',     sellerWeight: '-',   buyerWeight: 2.00,  weightDiff: '-',   reason: '-',       sellerAmount: '-',        buyerAmount: '¥8,600',   amountDiff: '-',  status: 'buyerExtra',  statusLabel: '买方多出' },
    ]);

    const filteredData = computed(() => {
      if (filterType.value === 'all') return allData.value;
      if (filterType.value === 'diff') return allData.value.filter(r => r.status === 'diff');
      if (filterType.value === 'sellerExtra') return allData.value.filter(r => r.status === 'sellerExtra');
      if (filterType.value === 'buyerExtra') return allData.value.filter(r => r.status === 'buyerExtra');
      return allData.value;
    });

    const statusType = (status) => {
      const map = { match: 'success', diff: 'warning', sellerExtra: '', buyerExtra: 'danger' };
      return map[status] || '';
    };

    const reasonType = (reason) => {
      const map = { '磅差': 'info', '运输损耗': 'warning', '含水量差异': 'info', '系统偏差': 'warning' };
      return map[reason] || 'info';
    };

    const rowClassName = ({ row }) => {
      if (row.status === 'diff') return 'warning-row';
      if (row.status === 'sellerExtra' || row.status === 'buyerExtra') return 'danger-row';
      return '';
    };

    return { filterType, filteredData, statusType, reasonType, rowClassName };
  }
});
app.use(ElementPlus);
for (const [key, component] of Object.entries(ElementPlusIconsVue)) {
  app.component(key, component);
}
app.mount('#app');
</script>
</body>
</html>
