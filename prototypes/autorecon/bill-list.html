<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>对账单列表 - 对账通原型</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/element-plus@2.9.1/dist/index.css">
  <script src="https://cdn.jsdelivr.net/npm/vue@3.5.13/dist/vue.global.prod.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/element-plus@2.9.1/dist/index.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@element-plus/icons-vue@2.3.1/dist/index.iife.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif; background: #f0f2f5; }
    .layout { display: flex; min-height: 100vh; }

    /* Sidebar */
    .sidebar { width: 220px; background: #001529; color: #fff; flex-shrink: 0; display: flex; flex-direction: column; position: fixed; top: 0; left: 0; bottom: 0; z-index: 100; overflow-y: auto; }
    .sidebar-logo { height: 60px; display: flex; align-items: center; justify-content: center; border-bottom: 1px solid rgba(255,255,255,0.08); }
    .sidebar-logo h1 { font-size: 18px; color: #fff; font-weight: 600; letter-spacing: 1px; }
    .sidebar-logo span { color: #409eff; }
    .sidebar-menu { flex: 1; padding: 8px 0; }
    .menu-group { margin-bottom: 4px; }
    .menu-group-title { padding: 10px 20px 6px; font-size: 12px; color: rgba(255,255,255,0.35); text-transform: uppercase; letter-spacing: 1px; }
    .menu-item { display: flex; align-items: center; padding: 10px 20px 10px 28px; color: rgba(255,255,255,0.65); text-decoration: none; font-size: 14px; transition: all 0.2s; cursor: pointer; }
    .menu-item:hover { color: #fff; background: rgba(255,255,255,0.06); }
    .menu-item.active { color: #fff; background: #409eff; }
    .menu-item .icon { margin-right: 8px; font-size: 16px; width: 16px; text-align: center; }
    .menu-sub .menu-item { padding-left: 44px; font-size: 13px; }

    /* Header */
    .main-area { margin-left: 220px; flex: 1; display: flex; flex-direction: column; min-height: 100vh; }
    .header { height: 60px; background: #fff; border-bottom: 1px solid #e8e8e8; display: flex; align-items: center; justify-content: space-between; padding: 0 24px; position: sticky; top: 0; z-index: 99; }
    .header-left { display: flex; align-items: center; gap: 16px; }
    .header-breadcrumb { font-size: 14px; color: #666; }
    .header-right { display: flex; align-items: center; gap: 16px; }
    .header-avatar { width: 32px; height: 32px; border-radius: 50%; background: #409eff; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 14px; }
    .header-user { font-size: 14px; color: #333; }

    /* Content */
    .content { flex: 1; padding: 20px 24px; }
    .page-title { font-size: 20px; font-weight: 600; color: #1a1a1a; margin-bottom: 16px; }

    /* Cards */
    .card { background: #fff; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); padding: 20px; margin-bottom: 16px; }
    .action-bar { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
  </style>
</head>
<body>
<div id="app">
  <div class="layout">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-logo">
        <h1><span>Auto</span>Recon 对账通</h1>
      </div>
      <nav class="sidebar-menu">
        <div class="menu-group">
          <a class="menu-item" href="dashboard.html"><span class="icon">📊</span>工作台</a>
        </div>
        <div class="menu-group">
          <div class="menu-group-title">对账管理</div>
          <div class="menu-sub">
            <a class="menu-item active" href="bill-list.html"><span class="icon">📋</span>对账单列表</a>
            <a class="menu-item" href="bill-create.html"><span class="icon">✏️</span>发起对账</a>
            <a class="menu-item" href="#"><span class="icon">📦</span>批量对账</a>
            <a class="menu-item" href="#"><span class="icon">📤</span>买方数据上传</a>
          </div>
        </div>
        <div class="menu-group">
          <div class="menu-group-title">异议处理</div>
          <div class="menu-sub">
            <a class="menu-item" href="#"><span class="icon">⚠️</span>异议列表</a>
          </div>
        </div>
        <div class="menu-group">
          <div class="menu-group-title">签章管理</div>
          <div class="menu-sub">
            <a class="menu-item" href="sign-pending.html"><span class="icon">✍️</span>待签章</a>
            <a class="menu-item" href="#"><span class="icon">🔏</span>印章管理</a>
          </div>
        </div>
        <div class="menu-group">
          <div class="menu-group-title">财务管理</div>
          <div class="menu-sub">
            <a class="menu-item" href="payment.html"><span class="icon">💰</span>付款管理</a>
            <a class="menu-item" href="#"><span class="icon">🧾</span>发票管理</a>
            <a class="menu-item" href="#"><span class="icon">📞</span>催收管理</a>
            <a class="menu-item" href="credit.html"><span class="icon">⭐</span>信用评分</a>
          </div>
        </div>
        <div class="menu-group">
          <div class="menu-group-title">数据分析</div>
          <div class="menu-sub">
            <a class="menu-item" href="analytics.html"><span class="icon">📈</span>数据分析</a>
          </div>
        </div>
        <div class="menu-group">
          <div class="menu-group-title">系统设置</div>
          <div class="menu-sub">
            <a class="menu-item" href="settings.html"><span class="icon">⚙️</span>系统设置</a>
          </div>
        </div>
      </nav>
    </aside>

    <!-- Main Area -->
    <div class="main-area">
      <header class="header">
        <div class="header-left">
          <span class="header-breadcrumb">对账管理 / 对账单列表</span>
        </div>
        <div class="header-right">
          <el-badge :value="3" :max="99">
            <el-icon :size="20"><bell /></el-icon>
          </el-badge>
          <div class="header-avatar">张</div>
          <span class="header-user">张经理</span>
        </div>
      </header>

      <div class="content">
        <h2 class="page-title">对账单列表</h2>

        <!-- Search Form -->
        <div class="card">
          <el-form :inline="true" :model="searchForm" size="default">
            <el-form-item label="对账单号">
              <el-input v-model="searchForm.billNo" placeholder="请输入对账单号" style="width: 160px" clearable />
            </el-form-item>
            <el-form-item label="买方企业">
              <el-input v-model="searchForm.buyer" placeholder="请输入买方企业" style="width: 160px" clearable />
            </el-form-item>
            <el-form-item label="状态">
              <el-select v-model="searchForm.status" placeholder="全部" style="width: 140px" clearable>
                <el-option label="全部" value="" />
                <el-option label="已创建" value="已创建" />
                <el-option label="已生成" value="已生成" />
                <el-option label="待审核" value="待审核" />
                <el-option label="异议中" value="异议中" />
                <el-option label="待签章" value="待签章" />
                <el-option label="已签章" value="已签章" />
                <el-option label="催收中" value="催收中" />
                <el-option label="已完成" value="已完成" />
                <el-option label="已作废" value="已作废" />
              </el-select>
            </el-form-item>
            <el-form-item label="对账周期">
              <el-date-picker v-model="searchForm.dateRange" type="daterange" range-separator="至" start-placeholder="开始日期" end-placeholder="结束日期" style="width: 260px" />
            </el-form-item>
            <el-form-item label="合同号">
              <el-input v-model="searchForm.contractNo" placeholder="请输入合同号" style="width: 140px" clearable />
            </el-form-item>
            <el-form-item>
              <el-button type="primary" @click="handleSearch">查询</el-button>
              <el-button @click="handleReset">重置</el-button>
            </el-form-item>
          </el-form>
        </div>

        <!-- Action Bar -->
        <div class="action-bar">
          <el-button type="primary" @click="location.href='bill-create.html'">
            <el-icon style="margin-right:4px"><plus /></el-icon>发起对账
          </el-button>
          <el-button>批量对账</el-button>
        </div>

        <!-- Table -->
        <div class="card" style="padding: 0;">
          <el-table :data="tableData" stripe style="width: 100%" header-cell-style="background:#fafafa;color:#333;font-weight:600">
            <el-table-column prop="billNo" label="对账单号" width="130">
              <template #default="{ row }">
                <a :href="'bill-detail.html?id=' + row.billNo" style="color:#409eff;text-decoration:none">{{ row.billNo }}</a>
              </template>
            </el-table-column>
            <el-table-column prop="buyer" label="买方企业" min-width="160" />
            <el-table-column prop="period" label="对账周期" width="230" />
            <el-table-column prop="totalAmount" label="交易总额" width="130" align="right" />
            <el-table-column prop="paidAmount" label="已付款" width="120" align="right" />
            <el-table-column prop="balance" label="应付余额" width="130" align="right">
              <template #default="{ row }">
                <span :style="{ color: row.balance !== '¥0.00' ? '#f56c6c' : '#67c23a', fontWeight: 600 }">{{ row.balance }}</span>
              </template>
            </el-table-column>
            <el-table-column prop="status" label="状态" width="100" align="center">
              <template #default="{ row }">
                <el-tag :type="getStatusType(row.status)" size="small" effect="light">{{ row.status }}</el-tag>
              </template>
            </el-table-column>
            <el-table-column prop="createdAt" label="创建时间" width="110" />
            <el-table-column label="操作" width="180" fixed="right">
              <template #default="{ row }">
                <el-button link type="primary" size="small" @click="location.href='bill-detail.html?id='+row.billNo">查看</el-button>
                <el-button v-if="row.status==='待审核' || row.status==='已生成'" link type="primary" size="small">发送</el-button>
                <el-button v-if="row.status==='待签章'" link type="primary" size="small">签章</el-button>
                <el-button v-if="row.status==='催收中'" link type="warning" size="small">催收</el-button>
                <el-button v-if="row.status==='已生成'" link type="danger" size="small">作废</el-button>
              </template>
            </el-table-column>
          </el-table>
          <div style="padding: 16px 20px; display: flex; justify-content: flex-end;">
            <el-pagination
              v-model:current-page="currentPage"
              :page-size="10"
              :total="86"
              layout="total, prev, pager, next, jumper"
              background
            />
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
const { createApp, ref, reactive } = Vue;
const app = createApp({
  setup() {
    const searchForm = reactive({
      billNo: '',
      buyer: '',
      status: '',
      dateRange: null,
      contractNo: ''
    });

    const currentPage = ref(1);

    const tableData = ref([
      { billNo: 'R202503001', buyer: '某某贸易有限公司', period: '2025-02-01 ~ 2025-02-28', totalAmount: '¥125,800.50', paidAmount: '¥50,000.00', balance: '¥75,800.50', status: '待审核', createdAt: '2025-03-17' },
      { billNo: 'R202503002', buyer: '某某制造有限公司', period: '2025-02-01 ~ 2025-02-28', totalAmount: '¥89,500.00', paidAmount: '¥89,500.00', balance: '¥0.00', status: '已签章', createdAt: '2025-03-16' },
      { billNo: 'R202503003', buyer: '某某科技股份有限公司', period: '2025-02-01 ~ 2025-02-28', totalAmount: '¥256,300.00', paidAmount: '¥100,000.00', balance: '¥156,300.00', status: '异议中', createdAt: '2025-03-16' },
      { billNo: 'R202503004', buyer: '某某建材有限公司', period: '2025-02-01 ~ 2025-02-28', totalAmount: '¥67,200.00', paidAmount: '¥0.00', balance: '¥67,200.00', status: '催收中', createdAt: '2025-03-15' },
      { billNo: 'R202503005', buyer: '某某物流有限公司', period: '2025-01-01 ~ 2025-01-31', totalAmount: '¥312,000.00', paidAmount: '¥312,000.00', balance: '¥0.00', status: '已完成', createdAt: '2025-03-15' },
      { billNo: 'R202503006', buyer: '某某建筑有限公司', period: '2025-02-01 ~ 2025-02-28', totalAmount: '¥178,600.00', paidAmount: '¥80,000.00', balance: '¥98,600.00', status: '待签章', createdAt: '2025-03-14' },
      { billNo: 'R202503007', buyer: '某某工程有限公司', period: '2025-02-01 ~ 2025-02-28', totalAmount: '¥45,800.00', paidAmount: '¥0.00', balance: '¥45,800.00', status: '已生成', createdAt: '2025-03-14' },
      { billNo: 'R202503008', buyer: '某某钢构有限公司', period: '2025-01-01 ~ 2025-01-31', totalAmount: '¥198,000.00', paidAmount: '¥198,000.00', balance: '¥0.00', status: '已完成', createdAt: '2025-03-13' },
    ]);

    const getStatusType = (status) => {
      const map = {
        '已创建': 'info',
        '已生成': 'info',
        '待审核': 'warning',
        '异议中': 'danger',
        '待签章': '',
        '已签章': 'success',
        '已完成': 'success',
        '催收中': 'warning',
        '已作废': 'info',
      };
      return map[status] || '';
    };

    const handleSearch = () => {
      ElementPlus.ElMessage.success('查询完成');
    };
    const handleReset = () => {
      Object.assign(searchForm, { billNo: '', buyer: '', status: '', dateRange: null, contractNo: '' });
    };

    return { searchForm, currentPage, tableData, getStatusType, handleSearch, handleReset };
  }
});
app.use(ElementPlus);
for (const [key, component] of Object.entries(ElementPlusIconsVue)) {
  app.component(key, component);
}
app.mount('#app');
</script>
</body>
</html>
