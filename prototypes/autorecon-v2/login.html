<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 - 对账通v2原型</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/element-plus@2.9.1/dist/index.css">
  <script src="https://cdn.jsdelivr.net/npm/vue@3.5.13/dist/vue.global.prod.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/element-plus@2.9.1/dist/index.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@element-plus/icons-vue@2.3.1/dist/index.iife.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      position: relative;
      overflow: hidden;
    }
    body::before {
      content: '';
      position: absolute;
      top: -20%;
      right: -10%;
      width: 600px;
      height: 600px;
      background: rgba(255,255,255,0.08);
      border-radius: 50%;
    }
    body::after {
      content: '';
      position: absolute;
      bottom: -30%;
      left: -10%;
      width: 500px;
      height: 500px;
      background: rgba(255,255,255,0.06);
      border-radius: 50%;
    }
    .login-wrap {
      display: flex;
      gap: 40px;
      align-items: center;
      z-index: 2;
      position: relative;
    }
    .login-brand {
      color: #fff;
      max-width: 420px;
    }
    .login-brand h1 {
      font-size: 56px;
      font-weight: 700;
      margin-bottom: 12px;
      letter-spacing: 2px;
    }
    .login-brand h2 {
      font-size: 22px;
      font-weight: 400;
      opacity: 0.85;
      margin-bottom: 30px;
    }
    .login-brand .features {
      list-style: none;
    }
    .login-brand .features li {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
      font-size: 15px;
      opacity: 0.9;
    }
    .login-brand .features .dot {
      width: 8px;
      height: 8px;
      background: #67c23a;
      border-radius: 50%;
      box-shadow: 0 0 8px rgba(103, 194, 58, 0.6);
    }
    .login-card {
      width: 420px;
      background: #fff;
      border-radius: 16px;
      padding: 40px 40px 32px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.2);
    }
    .login-title {
      text-align: center;
      margin-bottom: 32px;
    }
    .login-title h3 {
      font-size: 24px;
      color: #303133;
      font-weight: 600;
      margin-bottom: 6px;
    }
    .login-title p {
      font-size: 13px;
      color: #909399;
    }
    .login-form .el-input {
      height: 46px;
    }
    .login-btn {
      width: 100%;
      height: 44px;
      font-size: 16px;
      margin-top: 8px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border: none;
    }
    .login-btn:hover {
      opacity: 0.9;
    }
    .login-options {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 8px 0 4px;
      font-size: 13px;
    }
    .login-options a {
      color: #409eff;
      text-decoration: none;
    }
    .demo-accounts {
      margin-top: 24px;
      padding: 16px;
      background: #f5f7fa;
      border-radius: 8px;
      font-size: 12px;
    }
    .demo-accounts .demo-title {
      color: #909399;
      margin-bottom: 8px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .demo-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 8px;
      margin: 4px -4px;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.15s;
    }
    .demo-item:hover {
      background: #eaf3ff;
    }
    .demo-account {
      color: #606266;
      font-family: 'SFMono-Regular', Consolas, monospace;
    }
    .demo-role {
      color: #909399;
    }
    .login-footer {
      text-align: center;
      margin-top: 20px;
      color: #c0c4cc;
      font-size: 12px;
    }
    @media (max-width: 900px) {
      .login-brand { display: none; }
    }
  </style>
</head>
<body>
  <div id="app">
    <div class="login-wrap">
      <div class="login-brand">
        <h1>对账通 v2.1</h1>
        <h2>往来账对账 · 智能催收</h2>
        <ul class="features">
          <li><span class="dot"></span>银行对账单式往来流水，一目了然</li>
          <li><span class="dot"></span>三阶段差异化催收，客户等级驱动</li>
          <li><span class="dot"></span>AI 智能外呼（阿里云），承诺跟单闭环</li>
          <li><span class="dot"></span>科目过滤 + 余额快照，账实两条线</li>
          <li><span class="dot"></span>多端消息推送，状态实时可视</li>
        </ul>
      </div>

      <div class="login-card">
        <div class="login-title">
          <h3>欢迎登录</h3>
          <p>请使用您的账号登录系统</p>
        </div>

        <el-form :model="form" class="login-form" size="large" @submit.prevent="onLogin">
          <el-form-item>
            <el-input v-model="form.username" placeholder="账号" :prefix-icon="'User'">
              <template #prefix><el-icon><User/></el-icon></template>
            </el-input>
          </el-form-item>
          <el-form-item>
            <el-input v-model="form.password" type="password" show-password placeholder="密码">
              <template #prefix><el-icon><Lock/></el-icon></template>
            </el-input>
          </el-form-item>

          <div class="login-options">
            <el-checkbox v-model="form.remember">记住我</el-checkbox>
            <a href="#">忘记密码？</a>
          </div>

          <el-button type="primary" class="login-btn" @click="onLogin" :loading="loading">
            登 录
          </el-button>
        </el-form>

        <div class="demo-accounts">
          <div class="demo-title"><el-icon><InfoFilled/></el-icon>演示账号（点击自动填充）</div>
          <div class="demo-item" v-for="d in demos" :key="d.user" @click="fillDemo(d)">
            <span class="demo-account">{{ d.user }} / {{ d.pass }}</span>
            <el-tag size="small" :type="d.tagType" effect="light">{{ d.role }}</el-tag>
          </div>
        </div>

        <div class="login-footer">
          © 2026 对账通 AutoRecon v2.1 · 内部原型
        </div>
      </div>
    </div>
  </div>

  <script>
    const { createApp } = Vue;
    const app = createApp({
      data() {
        return {
          form: { username: '', password: '', remember: true },
          loading: false,
          demos: [
            { user: 'admin', pass: 'admin123', role: '平台管理员', tagType: 'danger' },
            { user: 'boss', pass: 'boss123', role: '企业管理员', tagType: 'warning' },
            { user: 'sales', pass: 'sales123', role: '销售员', tagType: 'primary' },
            { user: 'finance', pass: 'finance123', role: '财务', tagType: 'success' }
          ]
        }
      },
      methods: {
        fillDemo(d) {
          this.form.username = d.user;
          this.form.password = d.pass;
        },
        onLogin() {
          if (!this.form.username || !this.form.password) {
            ElementPlus.ElMessage.warning('请输入账号和密码');
            return;
          }
          this.loading = true;
          setTimeout(() => {
            ElementPlus.ElMessage.success('登录成功，正在进入工作台…');
            setTimeout(() => {
              window.location.href = 'dashboard.html';
            }, 400);
          }, 600);
        }
      }
    });
    app.use(ElementPlus);
    for (const [k, v] of Object.entries(ElementPlusIconsVue)) {
      app.component(k, v);
    }
    app.mount('#app');
  </script>
</body>
</html>
